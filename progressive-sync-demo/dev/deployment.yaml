apiVersion: apps/v1
kind: Deployment
metadata:
  name: progressive-demo
  labels:
    app.kubernetes.io/name: progressive-demo
    demo-stage: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: progressive-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: progressive-demo
        demo-stage: dev
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
