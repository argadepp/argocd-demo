apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: progressive-sync-demo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: dev
            namespace: progressive-dev
          - env: qa
            namespace: progressive-qa
          - env: prod
            namespace: progressive-prod
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: demo-environment
              operator: In
              values:
                - dev
        - matchExpressions:
            - key: demo-environment
              operator: In
              values:
                - qa
        - matchExpressions:
            - key: demo-environment
              operator: In
              values:
                - prod
  template:
    metadata:
      name: 'progressive-{{.env}}'
      labels:
        demo-environment: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/argadepp/argocd-demo.git
        targetRevision: feat/k3d-provider-support
        path: 'progressive-sync-demo/{{.env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
